<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 200" font-family="'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Arkusz, zdjęcia, sprawdzanie, raport"><rect x="0" y="0" width="320" height="200" fill="#FFD23F"/><text x="28" y="82" font-size="34" font-weight="800" fill="#0E1330">Arkusz</text><text x="28" y="124" font-size="19" fill="#0E1330">PDF dobrany</text><text x="28" y="150" font-size="19" fill="#0E1330">pod twoje luki</text><rect x="320" y="0" width="320" height="200" fill="#FF5C8A"/><text x="348" y="82" font-size="34" font-weight="800" fill="#0E1330">Zdjęcia</text><text x="348" y="124" font-size="19" fill="#0E1330">rozwiązujesz na kartce</text><text x="348" y="150" font-size="19" fill="#0E1330">i wysyłasz zdjęcia</text><rect x="640" y="0" width="320" height="200" fill="#12C8A0"/><text x="668" y="82" font-size="34" font-weight="800" fill="#0E1330">Sprawdzanie</text><text x="668" y="124" font-size="19" fill="#0E1330">punkty jak w CKE,</text><text x="668" y="150" font-size="19" fill="#0E1330">pytania zamiast gotowców</text><rect x="960" y="0" width="320" height="200" fill="#2B3BFF"/><text x="988" y="82" font-size="34" font-weight="800" fill="#FFFFFF">Raport</text><text x="988" y="124" font-size="19" fill="#FFFFFF">opanowanie, prognoza</text><text x="988" y="150" font-size="19" fill="#FFFFFF">i plan na tydzień</text></svg>